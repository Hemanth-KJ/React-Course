<!DOCTYPE html>
<html>
<head>
<title>chatbot</title>
<style>
   body{
      margin-top:0px;
      margin-bottom: 0px;
      font-family: Arial;
   }
   .chat-input-container{
      display: flex;
      margin-bottom: 60px;
   }
   .send-button{
      background-color: rgb(25,135,84);
      color:white;
      padding: 12px 20px;
      margin-left:10px;
      border: none;
      border-radius: 10px;
      font-size:15px;
      cursor:pointer;
   }
   .chat-input{
      padding: 12px 15px;
      border-radius: 10px;
      border-width:1px;
      font-size: 15px;
      flex-grow:1;
   }
   .app-container{
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      height:100vh;
      display: flex;
      flex-direction: column;
     
   }
   .chat-message-user{
   margin-top: 10px;
   display: flex;
   justify-content: end;
   align-items: start;
   
   }
   .chat-message-robot{
   margin-top: 10px;
   display: flex;
   align-items: start;
   }
   .chat-message-text{
      margin-left: 10px;
      margin-right: 10px;
      margin-bottom: 20px;
      background-color: rgb(238,238,238);
      padding: 15px 20px;
      border-radius: 10px;
      max-width:300px;

   }
    
   .chat-message-profile{
      width:45px;
   }
   .chat-message-container{
      flex-grow: 1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width: none;
   }
   .welcome-message {
        color: rgb(120, 120, 120);
        text-align: center;
      }

   .loading-spinner{
      height:40px;
      margin: -15px;
   }
</style>
</head>
<body>
   
<div class="js-container"></div>

<script src="https://unpkg.com/supersimpledev/react.js"></script>
<script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

<script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

<script src="https://unpkg.com/supersimpledev/babel.js"></script>
<script type="text/babel">

   function ChatInput({chatMessages, setChatMessages}) {
      const [inputText, setInputText] = React.useState('');

      function saveInputText(event){
        setInputText(event.target.value);
      }

      async function sendMessage(){
         setInputText('');
         const newChatMessages = [
            ...chatMessages,
            {
               message: inputText,
               sender:'user',
               id: crypto.randomUUID()
            }
         ];

         setChatMessages([
            ...newChatMessages,
            // This creates a temporary Loading... message.
            // Because we don't save this message in newChatMessages,
            // it will be removed later, when we add the response.
            {
              message: <img src="loading-spinner.gif" className="loading-spinner" />,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          const response = await Chatbot.getResponseAsync(inputText);

         setChatMessages([
            ...newChatMessages,
            {
               message: response,
               sender:'robot',
               id: crypto.randomUUID()
            }
         ]);

         setInputText('');
      }
      return (
         <div className="chat-input-container">
            <input 
               className="chat-input"
               placeholder="send a message to chatbot" 
               size ="30"
               onChange={saveInputText} 
               value ={inputText}
            />
            <button
             className="send-button"
             onClick={sendMessage}>
            Send
            </button>
         </div>
      );
   }

   function ChatMessage({ message, sender}) {
      //destructuring
      // const { message, sender}= props;
      // const sender = props.sender;
      //  const message = props.message;

      /*
      if(sender === 'robot'){
         return(
          <div>
             <img src="robot.png" width ="50" />
            {message}
         </div>
         );
      }
         */
   
      return (
         <div className={sender === 'user' ? 'chat-message-user' : 'chat-message-robot'}>
            {sender === 'robot' && 
             (
               <img src="robot.png" className="chat-message-profile" />
             )
            }
            <div className="chat-message-text">{message}</div>
            {sender ==='user' &&
             (
               <img src="user.png"  className="chat-message-profile"/>
             )
            }
         </div>
      );
   
   }

    function ChatMessages({chatMessages}) {
      const chatMessagesRef = React.useRef(null);
          
      React.useEffect(() =>{
        const containerElem = chatMessagesRef.current;
        if(containerElem){
         containerElem.scrollTop =containerElem.scrollHeight;
        }
      }, [chatMessages]);//Dependency array

      return(
         <div className="chat-message-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) =>{
               return (
                  <ChatMessage 
                     message={chatMessage.message}
                     sender={chatMessage.sender}
                     key={chatMessage.id}
                  />
               );
            })}
         </div>
      );
    }

    function App(){
     
       const  [chatMessages, setChatMessages] = React.useState([]);
      // const [chatMessage, setChatMessage] = array;
      // const chatMessages = array[0];
      // const setChatMessages = array[1];
      
        
      return (
         <div className="app-container">
            {chatMessages.length === 0 && (
                <p className="welcome-message">
                Welcome to the chatbot project! Send a message using the textbox below.
              </p>
            )}
            <ChatMessages 
             chatMessages={chatMessages}
            />
            <ChatInput 
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
            />
         </div>

      );
    }
     
    
   
    
const container = document.querySelector('.js-container');
ReactDOM.createRoot(container).render(<App/>);

</script>
</body>
</html>
